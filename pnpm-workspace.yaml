# pnpm 11 起，原先写在 package.json `pnpm` 字段里的设置搬到了这里
# （写回 package.json 只会得到 "no longer read by pnpm" 的警告）。
#
# esbuild 需要在安装时跑一次 postinstall 落地平台二进制；pnpm 默认拦截所有构建脚本。
#
# ⚠️ 字段名在 pnpm 12 里是 **allowBuilds**：旧名 onlyBuiltDependencies 在 12 上不再生效，
# 而"被忽略的构建脚本"在 12 里从警告升级成了**致命错误**（ERR_PNPM_IGNORED_BUILDS），
# 会直接让 `pnpm install` 失败 —— CI 就是挂在安装依赖这一步的。
allowBuilds:
  esbuild: true

# `pnpm run` 默认会先跑一次依赖校验（等于一次 install），每次多花几秒，
# 而且会被 esbuild 的 postinstall 拦截规则打断（ERR_PNPM_IGNORED_BUILDS）。
# 依赖由我们显式 `pnpm install`，跑脚本时不必再校验。
verifyDepsBeforeRun: false
