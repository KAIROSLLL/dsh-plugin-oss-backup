# 密钥泄漏检测 + 仓库自检。
#
# 为什么两套都要：
#   · Gitleaks 扫**提交历史与工作区**（含 diff），能发现"曾经提交过、后来删掉"的密钥；
#   · scripts/secret-scan.mjs 扫**当前文件树**，并且当环境里已设凭证时，
#     还能用那些**真实值**做一次全文件比对 —— 这一点 Gitleaks 做不到。
# 两者互补，缺一不可。
name: secret-scan

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # gitleaks-action 在 PR 上留评论需要它

jobs:
  gitleaks:
    name: Gitleaks（提交历史 + 工作区）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 必须取全量历史：只 checkout 一个 commit 的话，扫不到历史泄漏。
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  self-check:
    name: 仓库自检（build / test / secret-scan）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 先装 pnpm 再 setup-node（这样才能开 pnpm 缓存）。
      # 版本写死：corepack 在没看到 packageManager 字段时会取到别的大版本，
      # 而不同版本对"构建脚本审批"的行为不一样 —— 实测 CI 里就因此报了 ERR_PNPM_IGNORED_BUILDS。
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 构建
        run: pnpm run build
      - name: 单元测试
        run: pnpm test
      - name: 密钥自检（形态扫描）
        run: pnpm run check:secrets
      - name: 密钥扫描器自检（探针必须被检出）
        # 扫描器"静默退化"比没有扫描器更危险 —— 它会一直报 PASS 让人放心。
        # 这里往仓库根目录放一个含假 AK 的文件，**必须**被检出；顺带覆盖
        # "根目录新文件"与"点文件 / 无后缀文件"这两类曾经真的漏扫过的目标。
        run: |
          # 值拆成两段拼接：整串字面写出来的话，扫描器会把**这个 workflow 自己**当成泄漏
          # （实测踩过：`check:secrets` 报了 secret-scan.yml:57）。
          PROBE='AKIA''ZZ7QWERTY9UIOPASD'
          printf 'const k = "%s"\n' "$PROBE" > probe-leak.ts
          set +e
          pnpm run check:secrets
          status=$?
          rm -f probe-leak.ts
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::扫描器自检失败：根目录探针没有被检出，扫描范围可能退化了"
            exit 1
          fi
          echo "扫描器自检通过：根目录探针被正确检出"
      - name: 构建产物加载自检
        run: pnpm run check:load
